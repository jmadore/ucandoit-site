<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('unscramble-input');
    const button = document.getElementById('unscramble-btn');
    const results = document.getElementById('unscramble-results');

    function getCharFrequency(word) {
        const freq = new Array(26).fill(0);
        for (const char of word.toLowerCase()) {
            const code = char.charCodeAt(0) - 97;
            if (code >= 0 && code < 26) freq[code]++;
        }
        return freq;
    }

    function canBuildWord(word, available) {
        const freq = getCharFrequency(word);
        for (let i = 0; i < freq.length; i++) {
            if (freq[i] > available[i]) return false;
        }
        return true;
    }

    function unscramble(letters) {
        const cleaned = letters.toLowerCase().replace(/[^a-z]/g, '');
        if (!cleaned) return [];
        const available = getCharFrequency(cleaned);
        return window.CANADIAN_WORDS
            .filter(w => w.length >= 2 && w.length <= cleaned.length && canBuildWord(w, available))
            .sort((a, b) => b.length - a.length || a.localeCompare(b));
    }

    function render(words) {
        results.textContent = '';
        if (!words.length) {
            const empty = document.createElement('div');
            empty.className = 'text-center text-outline-variant py-8';
            empty.textContent = 'No words found.';
            results.appendChild(empty);
            return;
        }
        const groups = {};
        for (const w of words) {
            if (!groups[w.length]) groups[w.length] = [];
            groups[w.length].push(w);
        }
        Object.keys(groups).sort((a, b) => b - a).forEach(len => {
            const section = document.createElement('div');
            section.className = 'space-y-4';

            const heading = document.createElement('h3');
            heading.className = 'text-sm font-bold uppercase tracking-[0.2em] text-outline flex items-center gap-4';
            heading.appendChild(document.createTextNode(len + ' Letter Words'));
            const rule = document.createElement('div');
            rule.className = 'flex-grow h-px bg-outline-variant opacity-30';
            heading.appendChild(rule);

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4';
            groups[len].forEach(w => {
                const card = document.createElement('div');
                card.className = 'bg-surface-container-lowest p-4 rounded-lg text-center font-bold text-primary hover:bg-primary hover:text-white transition-colors cursor-pointer';
                card.textContent = w;
                grid.appendChild(card);
            });

            section.appendChild(heading);
            section.appendChild(grid);
            results.appendChild(section);
        });
    }

    button.addEventListener('click', function(e) {
        e.preventDefault();
        render(unscramble(input.value.trim()));
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') button.click();
    });
});
</script>
