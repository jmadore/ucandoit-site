<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8faf8;
        border-radius: 0.75rem;
        border: 2px solid #c1c8c2;

        transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
        user-select: none;
    }
    .cell:hover:not(.taken) {
        background: #f2f4f2;
        border-color: #a5d0b9;
        transform: scale(1.04);
        box-shadow: 0 8px 20px rgba(1,45,29,0.1);
    }
    .cell.taken  { cursor: default; }
    .cell.winning {
        background: #ffdad8;
        border-color: #a61d24;
        box-shadow: 0 0 0 3px rgba(166,29,36,0.2);
    }
    @keyframes pop {
        from { transform: scale(0.35); opacity: 0; }
        to   { transform: scale(1);    opacity: 1; }
    }
    .pop { animation: pop 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }

    .mode-btn {
        padding: 0.8rem 0.75rem;
        border-radius: 0.5rem;

<script>
/* ─── DOM helper: create element with inline styles and optional text ─── */
function mk(tag, css, txt) {
    const e = document.createElement(tag);
    if (css) e.style.cssText = css;
    if (txt !== undefined) e.textContent = txt;
    return e;
}

/* ─── Symbol factories — all DOM, no innerHTML ─── */
function imgSymbol(src, alt, size) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt;
    img.width = size;
    img.height = size;
    img.className = 'symbol-img';
    img.style.width = size + 'px';
    img.style.height = size + 'px';
    return img;
}

function assetSymbol(file, label, sizes) {
    return {
        label,
        cell: () => imgSymbol('assets/' + file, label, sizes.cell),
        icon: () => imgSymbol('assets/' + file, label, sizes.icon),
        big:  () => imgSymbol('assets/' + file, label, sizes.big),
    };
}

const SYM = {
    classic: {
        name: 'Classic X & O',
        p1: {
            label: 'X',
            cell:   () => mk('span', 'font-size:3.2rem;font-weight:900;color:#a61d24;line-height:1;font-family:Manrope,sans-serif', '✕'),
            icon:   () => mk('span', 'font-size:1.5rem;font-weight:900;color:#a61d24;line-height:1', '✕'),
            big:    () => mk('span', 'font-size:4.5rem;font-weight:900;color:#a61d24;line-height:1', '✕'),
        },
        p2: {
            label: 'O',
            cell:   () => mk('span', 'font-size:4.2rem;font-weight:900;color:#1b4332;line-height:1;font-family:Manrope,sans-serif', '○'),
            icon:   () => mk('span', 'font-size:2rem;font-weight:900;color:#1b4332;line-height:1', '○'),
            big:    () => mk('span', 'font-size:6rem;font-weight:900;color:#1b4332;line-height:1', '○'),
        },
    },
    bears: {
        name: 'Beaver & Bear',
        p1: assetSymbol('beaver.png', 'Beaver', { cell: 62, icon: 30, big: 88 }),
        p2: assetSymbol('bear.png', 'Bear', { cell: 62, icon: 30, big: 88 }),
    },
    goose: {
        name: 'Goose & Moose',
        p1: assetSymbol('goose.png', 'Goose', { cell: 66, icon: 30, big: 92 }),
        p2: assetSymbol('moose.png', 'Moose', { cell: 66, icon: 30, big: 92 }),
    },
    hockey: {
        name: 'Sticks & Puck',
        p1: assetSymbol('hockey-sticks.png', 'Sticks', { cell: 66, icon: 30, big: 92 }),
        p2: assetSymbol('puck.png', 'Puck', { cell: 60, icon: 30, big: 86 }),
    },
    curling: {
        name: 'Curling',
        p1: assetSymbol('brooms.png', 'Brooms', { cell: 66, icon: 30, big: 92 }),
        p2: assetSymbol('stone.png', 'Stone', { cell: 60, icon: 30, big: 86 }),
    },
    timmies: {
        name: 'Timmies',
        p1: assetSymbol('coffee.png', 'Coffee', { cell: 62, icon: 30, big: 88 }),
        p2: assetSymbol('bit.png', 'Bite', { cell: 58, icon: 30, big: 84 }),
    },
};

/* ─── Win messages ─── */
const WIN_MSGS  = ["What a beauty, eh? 🍁","That's a hat trick! 🏒","Double-double victory! ☕","Beauty play, bud! 🇨🇦","Toque off to you! 🧢","Sweet as maple syrup! 🍯"];
const DRAW_MSGS = ["It's a draw, buddy! Settle it over a double-double ☕","Too polite to win, eh? 🍁","Tie game — grab a Tim's and go again ☕"];
const CPU_MSGS  = ["The computer wins! Better luck next time, eh? 🤖","Looks like the robot knows hockey too 🏒","Sorry not sorry! — The CPU 🇨🇦"];

const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

/* ─── State ─── */
let mode   = 1;
let symKey = 'classic';
let board  = Array(9).fill(null);
let cur    = 1;
let scores = { 1: 0, 2: 0, draws: 0 };
let active = false;

/* ─── Setup actions ─── */
function setMode(m) {
    mode = m;
    document.getElementById('btn-1p').classList.toggle('active', m === 1);
    document.getElementById('btn-2p').classList.toggle('active', m === 2);
}

function setSymbolSet(key) {
    symKey = key;
    ['classic','bears','goose','hockey','curling','timmies'].forEach(k =>
        document.getElementById('sym-' + k).classList.toggle('selected', k === key)
    );
}

function startGame() {
    document.getElementById('p1-label').textContent = mode === 1 ? 'You' : 'Player 1';
    document.getElementById('p2-label').textContent = mode === 1 ? 'Computer' : 'Player 2';
    scores = { 1: 0, 2: 0, draws: 0 };
    refreshScoreIcons();
    updateScoreNums();
    resetBoard();
}

/* ─── Board ─── */
function buildBoard() {
    const el = document.getElementById('board');
    while (el.firstChild) el.removeChild(el.firstChild);
    for (let i = 0; i < 9; i++) {
        const c = document.createElement('div');
        c.className = 'cell';
        c.id = 'cell-' + i;
        c.addEventListener('click', () => handleClick(i));
        el.appendChild(c);
    }
}

function clearCell(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
}

function placeSymbol(idx, player) {
    const cell = document.getElementById('cell-' + idx);
    clearCell(cell);
    const pKey = player === 1 ? 'p1' : 'p2';
    const node = SYM[symKey][pKey].cell();
    node.classList.add('pop');
    cell.appendChild(node);
    cell.classList.add('taken');
}

function resetBoard() {
    board  = Array(9).fill(null);
    cur    = 1;
    active = true;
    document.getElementById('result-modal').classList.add('hidden');
    buildBoard();
    refreshTurnBar();
}

/* ─── Gameplay ─── */
function handleClick(i) {
    if (!active || board[i]) return;
    if (mode === 1 && cur === 2) return;
    place(i, cur);
}

function place(i, player) {
    board[i] = player;
    placeSymbol(i, player);

    const winner = getWinner();
    if (winner) { endGame(winner); return; }
    if (board.every(Boolean)) { endGame(null); return; }

    cur = cur === 1 ? 2 : 1;
    refreshTurnBar();

    if (mode === 1 && cur === 2 && active) {
        active = false;
        setTimeout(() => {
            active = true;
            place(bestMove(), 2);
        }, 480);
    }
}

/* ─── AI: minimax ─── */
function bestMove() {
    let best = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
        if (!board[i]) {
            board[i] = 2;
            const s = minimax(board, 0, false);
            board[i] = null;
            if (s > best) { best = s; move = i; }
        }
    }
    return move;
}

function minimax(b, depth, isMax) {
    const w = winnerOf(b);
    if (w === 2) return 10 - depth;
    if (w === 1) return depth - 10;
    if (b.every(Boolean)) return 0;
    let best = isMax ? -Infinity : Infinity;
    const p  = isMax ? 2 : 1;
    for (let i = 0; i < 9; i++) {
        if (!b[i]) {
            b[i] = p;
            const s = minimax(b, depth + 1, !isMax);
            b[i] = null;
            best = isMax ? Math.max(best, s) : Math.min(best, s);
        }
    }
    return best;
}

/* ─── Win detection ─── */
function getWinner()    { return winnerOf(board); }
function winnerOf(b)    { for (const [a,x,c] of LINES) if (b[a] && b[a]===b[x] && b[a]===b[c]) return b[a]; return null; }
function winningLine()  { for (const ln of LINES) { const [a,x,c]=ln; if (board[a] && board[a]===board[x] && board[a]===board[c]) return ln; } return null; }

/* ─── End game ─── */
function endGame(winner) {
    active = false;
    if (winner) {
        scores[winner]++;
        const ln = winningLine();
        if (ln) ln.forEach(i => document.getElementById('cell-' + i).classList.add('winning'));
    } else {
        scores.draws++;
    }
    updateScoreNums();
    setTimeout(() => showResult(winner), 680);
}

function showResult(winner) {
    const iconEl  = document.getElementById('result-icon');
    const titleEl = document.getElementById('result-title');
    const msgEl   = document.getElementById('result-msg');

    clearCell(iconEl);

    if (winner === null) {
        iconEl.appendChild(mk('span', 'font-size:4rem;color:#717973;line-height:1', '–'));
        titleEl.textContent  = "It's a Draw!";
        msgEl.textContent    = DRAW_MSGS[Math.floor(Math.random() * DRAW_MSGS.length)];
    } else if (mode === 1 && winner === 2) {
        const cpuIcon = document.createElement('span');
        cpuIcon.className = 'material-symbols-outlined';
        cpuIcon.style.cssText = 'font-size:4.5rem;color:#012d1d;line-height:1';
        cpuIcon.textContent = 'smart_toy';
        iconEl.appendChild(cpuIcon);
        titleEl.textContent  = "Computer Wins!";
        msgEl.textContent    = CPU_MSGS[Math.floor(Math.random() * CPU_MSGS.length)];
    } else {
        const pKey = winner === 1 ? 'p1' : 'p2';
        iconEl.appendChild(SYM[symKey][pKey].big());
        const label = winner === 1
            ? (mode === 1 ? 'You win' : 'Player 1 wins')
            : 'Player 2 wins';
        titleEl.textContent = label + '!';
        msgEl.textContent   = WIN_MSGS[Math.floor(Math.random() * WIN_MSGS.length)];
    }

    document.getElementById('result-modal').classList.remove('hidden');
}

/* ─── UI helpers ─── */
function refreshTurnBar() {
    const pKey   = cur === 1 ? 'p1' : 'p2';
    const isCPU  = mode === 1 && cur === 2;
    const iconEl = document.getElementById('turn-icon');
    clearCell(iconEl);
    iconEl.appendChild(SYM[symKey][pKey].icon());
    document.getElementById('turn-text').textContent = isCPU
        ? 'Computer is thinking…'
        : (mode === 1 ? 'Your turn!' : 'Player ' + cur + '\'s turn!');
    document.getElementById('turn-bar').style.background = cur === 1 ? '#ffdad8' : '#c1ecd4';
}

function refreshScoreIcons() {
    const p1el = document.getElementById('p1-score-icon');
    const p2el = document.getElementById('p2-score-icon');
    clearCell(p1el); clearCell(p2el);
    p1el.appendChild(SYM[symKey].p1.icon());
    p2el.appendChild(SYM[symKey].p2.icon());
}

function updateScoreNums() {
    document.getElementById('score-p1').textContent    = scores[1];
    document.getElementById('score-p2').textContent    = scores[2];
    document.getElementById('score-draws').textContent = scores.draws;
}

function rematch() { resetBoard(); }
function newGame()  { document.getElementById('result-modal').classList.add('hidden'); startGame(); }

startGame();
</script>
</body>
</html>
